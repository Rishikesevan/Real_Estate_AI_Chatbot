<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Link | EliteNest</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#635bff',
                        'primary-hover': '#5851eb',
                        dark: '#0a2540',
                        light: '#f6f9fc',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f6f9fc; color: #425466; font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .premium-card { background: white; border-radius: 2.5rem; border: 1px solid #e2e8f0; box-shadow: 0 50px 100px -20px rgba(10, 37, 64, 0.05); }
        .icon-circle { width: 80px; height: 80px; border-radius: 100%; display: flex; align-items: center; justify-content: center; margin: 0 auto; background: #fef2f2; color: #ef4444; }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_bottom_left,_var(--tw-gradient-stops))] from-red-50 via-white to-slate-50">

    <div class="w-full max-w-md animate-fade-in-up">
        <div class="text-center mb-10">
            <a th:href="@{/}" class="inline-flex items-center gap-2 no-underline mb-8">
                <div class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center shadow-lg">
                    <i class="bi bi-building"></i>
                </div>
                <span class="font-bold text-2xl text-dark tracking-tight">EliteNest</span>
            </a>
        </div>

        <div class="premium-card p-10 md:p-14 text-center">
            <div class="icon-circle mb-8 animate-bounce" style="animation-duration: 2s;">
                <i class="bi bi-x-circle text-4xl"></i>
            </div>

            <div class="mb-10">
                <span class="bg-red-50 text-danger px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 inline-block border border-red-100 italic">Error Alert</span>
                <h2 class="text-3xl font-extrabold text-dark tracking-tight mb-4">Verification Failed</h2>
                <p class="text-slate-500 font-medium leading-relaxed">
                    The link is either invalid or has expired. Please try to sign up again or request a new verification link.
                </p>
            </div>

            <a th:href="@{/api/signup}" class="stripe-btn w-full !bg-dark hover:!bg-black no-underline block shadow-lg">
                Return to Sign Up
            </a>

            <div class="mt-8 pt-6 border-t border-slate-50">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-relaxed">
                    Need help? <a href="#" class="text-primary hover:underline no-underline">Contact Support</a>
                </p>
            </div>
        </div>
        
    </div>

</body>
</html>
